version: '3.8'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: palet
      POSTGRES_PASSWORD: palet
      POSTGRES_DB: palet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: rust-backend/Dockerfile
    environment:
      PALET__DATABASE_URL: postgres://palet:palet@db:5432/palet
      PALET__ENVIRONMENT: production
      PALET__LOG_LEVEL: info
      PALET__JWT_SECRET: super-secret-key-for-production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: rust-frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
