services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: palet
      POSTGRES_PASSWORD: palet
      POSTGRES_DB: palet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Seed dev : exécuté une seule fois, à la première initialisation
      # (volume pgdata vide), via /docker-entrypoint-initdb.d.
      # Pour re-seeder : docker compose down -v && docker compose up
      - ./dev-data:/dev-data:ro
      - ./dev-data/init-db.sh:/docker-entrypoint-initdb.d/01-seed-dev-data.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: rust-backend/Dockerfile
    environment:
      PALET__DATABASE_URL: postgres://palet:palet@db:5432/palet
      PALET__ENVIRONMENT: production
      PALET__LOG_LEVEL: info
      PALET__JWT_SECRET: super-secret-key-for-production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Image scratch : seul busybox est présent, et on cible 127.0.0.1
      # (pas de /etc/hosts dans l'image → "localhost" non résoluble).
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: rust-frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
