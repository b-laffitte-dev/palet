services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: palet
      POSTGRES_PASSWORD: palet
      POSTGRES_DB: palet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://palet:palet@db:5432/palet
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
