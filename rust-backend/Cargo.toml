[package]
name = "palet-backend"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Backend API for Palet Vendéen - Rust implementation"

[dependencies]
# Async trait
async-trait = "0.1.92"

# Web framework
actix-web = "4.17.0"
actix-cors = "0.7.2"

# Database (features "migrate" + "macros" pour sqlx::migrate! sur ./migrations)
sqlx = { version = "^0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "time", "json", "migrate", "macros"] }

# Auth : JWT (HS256) + hash de mots de passe Argon2id
jsonwebtoken = { version = "12.0", features = ["rust_crypto"] }
argon2 = { version = "0.6", features = ["password-hash"] }
rand = "0.10"

# Error handling
thiserror = "2.0.21"

# UUID with SQLx support
uuid = { workspace = true }

# Time with SQLx support
time = { workspace = true }

# Async runtime
tokio = { version = "1.53.3", features = ["full"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
config = { version = "0.15.27", features = ["toml", "json", "ini"] }
env_logger = "0.11.11"
log = { workspace = true }
dotenvy = "0.15"

# Shared types
palet-shared = { path = "../rust-shared" }

# OpenAPI documentation
utoipa = { version = "6.0.0", features = ["actix_extras", "time", "uuid"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["actix-web"] }

[dev-dependencies]

[features]
default = []

[lib]
name = "palet_backend"
path = "src/lib.rs"

[[bin]]
name = "palet-backend"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
