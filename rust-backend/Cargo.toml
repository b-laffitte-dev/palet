[package]
name = "palet-backend"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Backend API for Palet Vendéen - Rust implementation"

[dependencies]
# Async trait
async-trait = "0.1"

# Web framework
actix-web = "4"
actix-cors = "0.7"

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json"] }

# Error handling
thiserror = "1"

# UUID with SQLx support
uuid = { version = "1", features = ["v4", "serde"] }

# Time with SQLx support
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
config = { version = "0.13", features = ["toml", "json", "ini"] }
env_logger = "0.10"
log = "0.4"
dotenv = "0.15"

# Shared types
palet-shared = { path = "../rust-shared" }

# OpenAPI documentation
utoipa = { version = "4", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "4", features = ["actix-web"] }

[dev-dependencies]
actix-http-test = "3"
actix-rt = "2"
serial_test = "3"
tokio = { version = "1", features = ["full", "test-util"] }
async-trait = "0.1"
mockall = "0.12"

[features]
default = []

[lib]
name = "palet_backend"
path = "src/lib.rs"

[[bin]]
name = "palet-backend"
path = "src/main.rs"
