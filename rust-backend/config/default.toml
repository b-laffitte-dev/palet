# Default configuration for Palet Vendéen Backend

[default]
host = "0.0.0.0"
port = 3000
database_url = "postgres://palet:palet@localhost:5432/palet"
db_max_connections = 20
db_timeout_secs = 30
cors_max_age = 86400
environment = "development"
log_level = "info"
# Secret de dev uniquement : en production (PALET__ENVIRONMENT=production),
# PALET__JWT_SECRET (>= 32 caractères) est exigé au démarrage — voir .env.example.
jwt_secret = "dev-only-insecure-secret"
jwt_expiration_hours = 24
jwt_refresh_expiration_days = 7
