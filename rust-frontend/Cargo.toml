[package]
name = "palet-frontend"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Frontend web application for Palet Vendéen - Dioxus implementation"

[workspace]
# Allow standalone build
members = []

[lib]
crate-type = ["cdylib"]

[dependencies]
# Dioxus for web
dioxus = { version = "0.5", features = ["web", "router"] }
dioxus-web = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Chrono for dates
chrono = { version = "0.4", features = ["serde"] }

# Shared types
palet-shared = { path = "../rust-shared" }

# Utilities
log = "0.4"
wasm-logger = "0.2"

# For WASM
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "console", "Location", "XmlHttpRequest"] }

# Regex for validation
regex = "1"

[features]
default = ["web"]
web = []

[dev-dependencies]
wasm-bindgen-test = "0.3"
