[package]
name = "palet-frontend"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Frontend web application for Palet Vendéen - Rust/Yew implementation"

[lib]
name = "palet_frontend"
crate-type = ["cdylib"]

[dependencies]
# Web framework
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"

# HTML templating
html = "0.3"

# Styling
css-in-rs = "0.1"

# HTTP client (using wasm-compatible version)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "console", "Location"] }
js-sys = "0.3"
gloo = { version = "0.10", features = ["storage", "timers"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared types
palet-shared = { path = "../rust-shared" }

# Utilities
log = "0.4"
wasm-logger = "0.2"

[features]
default = ["web"]
web = []

[dev-dependencies]
wasm-bindgen-test = "0.3"
