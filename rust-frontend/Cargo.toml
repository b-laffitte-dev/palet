[package]
name = "palet-frontend"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Frontend web application for Palet Vendéen - Dioxus implementation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Dioxus for web
dioxus = { version = "0.7.10", features = ["web", "router"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# UUID ("js" : nécessaire pour Uuid::new_v4() sur wasm32-unknown-unknown)
uuid = { workspace = true, features = ["js"] }

# Time for dates ("wasm-bindgen" : now_utc() fonctionne sur wasm32-unknown-unknown)
time = { workspace = true, features = ["wasm-bindgen"] }

# Shared types
palet-shared = { path = "../rust-shared" }

# Utilities
log = { workspace = true }
wasm-logger = "0.2"

# For WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "RequestInit", "Headers", "Response", "Storage"] }

[features]
default = ["web"]
web = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
dioxus-ssr = "0.7"
