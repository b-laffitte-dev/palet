# cargo-audit configuration
# h2 0.3.x is pinned by actix-http 3.x (required by actix-web 4.x); no patched 0.3.x exists.
# Re-evaluate when migrating to actix-web 5 / actix-http 4 (h2 0.4).
#
# libsqlite3-sys 0.37 is only pulled in as an optional dependency of sqlx-sqlite
# (sqlx 0.9.0 declares it in its manifest, so it appears in Cargo.lock), but the
# sqlite feature is never enabled: sqlx is used with default-features = false and
# only the postgres feature, so libsqlite3-sys is never compiled into our builds.
# sqlx 0.9.0 (latest release) pins libsqlite3-sys <0.38.0, so no patched >=0.39.0
# can be selected. Re-evaluate on the next sqlx upgrade.
[advisories]
ignore = ["RUSTSEC-2026-0258", "RUSTSEC-2026-0459"]
