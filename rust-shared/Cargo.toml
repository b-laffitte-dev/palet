[package]
name = "palet-shared"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Shared types and utilities for Palet Vendéen Rust project"

[dependencies]
# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# OpenAPI documentation
utoipa = { version = "6.0.0", features = ["macros", "chrono", "uuid"] }

# Types
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Validation
validator = { version = "0.21.0", features = ["derive"] }

[features]
default = []
mobile = []

[lib]
name = "palet_shared"
crate-type = ["cdylib", "rlib"]
