[package]
name = "palet-shared"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Shared types and utilities for Palet Vendéen Rust project"

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# OpenAPI documentation
utoipa = { version = "6.0.0", features = ["macros", "time", "uuid"] }

# Types
uuid = { workspace = true }
time = { workspace = true }

[features]
default = []
mobile = []

[lib]
name = "palet_shared"
crate-type = ["cdylib", "rlib"]
