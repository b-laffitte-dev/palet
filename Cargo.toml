[workspace]
members = [
    "rust-backend",
    "rust-shared",
    "rust-frontend",
]
exclude = [
    "rust-mobile",
]
resolver = "2"

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
