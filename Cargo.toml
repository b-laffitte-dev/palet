[workspace]
members = [
    "rust-backend",
    "rust-shared",
]
resolver = "2"

# Frontend and mobile are excluded from workspace due to WASM/OpenSSL dependencies
# They can be built separately when needed:
# - rust-frontend: requires wasm-pack and web-sys dependencies
# - rust-mobile: requires platform-specific Tauri setup

[workspace.dependencies]
# Shared dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
