name: Rust CI

on:
  push:
    branches: [main, project/rust]
    paths:
      - 'rust-backend/**'
      - 'rust-frontend/**'
      - 'rust-shared/**'
      - 'rust-mobile/**'
      - 'Cargo.toml'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main, project/rust]
    paths:
      - 'rust-backend/**'
      - 'rust-frontend/**'
      - 'rust-shared/**'
      - 'rust-mobile/**'
      - 'Cargo.toml'
      - '.github/workflows/rust-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test and build backend
  backend:
    name: Backend (Actix-web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: palet
          POSTGRES_PASSWORD: palet
          POSTGRES_DB: palet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions-rs/cargo@v1
        with:
          command: cache
          working-directory: rust-backend

      - name: Install dependencies
        working-directory: rust-backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Check formatting
        working-directory: rust-backend
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: rust-backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build backend
        working-directory: rust-backend
        env:
          PALET__DATABASE_URL: postgres://palet:palet@localhost:5432/palet
          PALET__ENVIRONMENT: test
        run: cargo build --release

      - name: Run tests
        working-directory: rust-backend
        env:
          PALET__DATABASE_URL: postgres://palet:palet@localhost:5432/palet
          PALET__ENVIRONMENT: test
        run: cargo test --release

  # Test and build frontend (WASM)
  frontend:
    name: Frontend (Yew)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
          target: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions-rs/cargo@v1
        with:
          command: cache
          working-directory: rust-frontend

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Check formatting
        working-directory: rust-frontend
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: rust-frontend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build frontend (WASM)
        working-directory: rust-frontend
        run: |
          wasm-pack build --target web --out-name palet_frontend --out-dir ./pkg

      - name: Build frontend (release)
        working-directory: rust-frontend
        run: cargo build --release --features web

  # Test shared library
  shared:
    name: Shared Library
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions-rs/cargo@v1
        with:
          command: cache
          working-directory: rust-shared

      - name: Check formatting
        working-directory: rust-shared
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: rust-shared
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build shared library
        working-directory: rust-shared
        run: cargo build --release

      - name: Run tests
        working-directory: rust-shared
        run: cargo test --release

  # Build mobile (Tauri)
  mobile:
    name: Mobile (Tauri)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache dependencies
        uses: actions-rs/cargo@v1
        with:
          command: cache
          working-directory: rust-mobile

      - name: Check formatting
        working-directory: rust-mobile
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: rust-mobile
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build mobile
        working-directory: rust-mobile
        run: cargo build --release --features mobile

  # Build Docker images
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, shared, mobile]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rust-backend/Dockerfile
          push: true
          tags: |
            ${{ github.repository_owner }}/palet-backend:latest
            ${{ github.repository_owner }}/palet-backend:${{ github.sha }}

      - name: Build and push frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rust-frontend/Dockerfile
          push: true
          tags: |
            ${{ github.repository_owner }}/palet-frontend:latest
            ${{ github.repository_owner }}/palet-frontend:${{ github.sha }}

      - name: Build backend image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rust-backend/Dockerfile
          push: false
          tags: palet-backend:pr

      - name: Build frontend image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rust-frontend/Dockerfile
          push: false
          tags: palet-frontend:pr

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [backend, frontend, shared, mobile]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        working-directory: .
        run: cargo audit --deny warnings

  # Code coverage (optional - requires nightly)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust (nightly)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        working-directory: rust-backend
        run: |
          cargo tarpaulin --release --out xml -- --test-threads 1
          cargo tarpaulin --report --out-dir ./coverage

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: rust
          name: rust-coverage
