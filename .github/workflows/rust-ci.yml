name: Rust CI

on:
  push:
    branches: [main, project/rust]
    paths:
      - 'rust-backend/**'
      - 'rust-shared/**'
      - 'Cargo.toml'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main, project/rust]
    paths:
      - 'rust-backend/**'
      - 'rust-shared/**'
      - 'Cargo.toml'
      - '.github/workflows/rust-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test and build backend
  backend:
    name: Backend (Actix-web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: palet
          POSTGRES_PASSWORD: palet
          POSTGRES_DB: palet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: rust-backend

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Check formatting
        working-directory: rust-backend
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: rust-backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build backend
        working-directory: rust-backend
        env:
          PALET__DATABASE_URL: postgres://palet:palet@localhost:5432/palet
          PALET__ENVIRONMENT: test
        run: cargo build --release

      - name: Run tests
        working-directory: rust-backend
        env:
          PALET__DATABASE_URL: postgres://palet:palet@localhost:5432/palet
          PALET__ENVIRONMENT: test
        run: cargo test --release

  # Test shared library
  shared:
    name: Shared Library
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: rust-shared

      - name: Check formatting
        working-directory: rust-shared
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: rust-shared
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build shared library
        working-directory: rust-shared
        run: cargo build --release

      - name: Run tests
        working-directory: rust-shared
        run: cargo test --release

  # Build Docker images (only on push to main, not PR)
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, shared]
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rust-backend/Dockerfile
          push: true
          tags: |
            ${{ github.repository_owner }}/palet-backend:latest
            ${{ github.repository_owner }}/palet-backend:${{ github.sha }}

  # Security audit (only on push to main, not PR)
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [backend, shared]
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit --deny warnings
