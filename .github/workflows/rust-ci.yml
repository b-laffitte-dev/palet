name: Rust CI

on:
  push:
    branches: [main, project/rust]
    paths:
      - 'rust-backend/**'
      - 'rust-frontend/**'
      - 'rust-shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main, project/rust]
    paths:
      - 'rust-backend/**'
      - 'rust-frontend/**'
      - 'rust-shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test and build backend
  backend:
    name: Backend (Actix-web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: palet
          POSTGRES_PASSWORD: palet
          POSTGRES_DB: palet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Check formatting
        working-directory: rust-backend
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: rust-backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build backend
        working-directory: rust-backend
        env:
          PALET__DATABASE_URL: postgres://palet:palet@localhost:5432/palet
          PALET__ENVIRONMENT: test
          RUST_LOG: debug
        run: cargo build --release

      - name: Run tests
        working-directory: rust-backend
        env:
          PALET__DATABASE_URL: postgres://palet:palet@localhost:5432/palet
          PALET__ENVIRONMENT: test
        run: cargo test -- --nocapture

  # Test shared library
  shared:
    name: Shared Library
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-shared

      - name: Check formatting
        working-directory: rust-shared
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: rust-shared
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build shared library
        working-directory: rust-shared
        run: cargo build --release

      - name: Run tests
        working-directory: rust-shared
        run: cargo test

  # Test and build frontend (Dioxus WASM) — e2e navigateur non couvert en CI
  # (pas de navigateur disponible) : on valide le build/link wasm complet.
  frontend:
    name: Frontend (Dioxus WASM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-frontend

      - name: Check formatting
        working-directory: rust-frontend
        run: cargo fmt -- --check

      - name: Run unit tests (host)
        working-directory: rust-frontend
        run: cargo test

      - name: Check WASM target
        working-directory: rust-frontend
        run: cargo check --target wasm32-unknown-unknown

      - name: Build WASM (full link)
        working-directory: rust-frontend
        run: cargo build --target wasm32-unknown-unknown

  # Publish Docker images to the dev registry (custom registry via secrets)
  # Dev deployment only runs on push to main, never on other branches or PRs
  docker-dev:
    name: Docker Dev (custom registry)
    runs-on: ubuntu-latest
    needs: [backend, shared, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The secrets context is not available in step `if`, so probe the
      # credentials in a shell step and expose the result as an output.
      - name: Check dev registry credentials
        id: creds
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_LOGIN_USER: ${{ secrets.DOCKER_LOGIN_USER }}
          DOCKER_LOGIN_PASS: ${{ secrets.DOCKER_LOGIN_PASS }}
        run: |
          if [ -n "$DOCKER_REGISTRY" ] && [ -n "$DOCKER_LOGIN_USER" ] && [ -n "$DOCKER_LOGIN_PASS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets DOCKER_REGISTRY / DOCKER_LOGIN_USER / DOCKER_LOGIN_PASS are not configured - skipping dev registry push"
          fi

      - name: Set up Docker Buildx
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to dev registry
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_LOGIN_USER }}
          password: ${{ secrets.DOCKER_LOGIN_PASS }}

      - name: Build and push backend image (dev)
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: rust-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository_owner }}/palet-backend:dev
            ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository_owner }}/palet-backend:dev-${{ github.sha }}

      - name: Build and push frontend image (dev)
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: rust-frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository_owner }}/palet-frontend:dev
            ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository_owner }}/palet-frontend:dev-${{ github.sha }}

