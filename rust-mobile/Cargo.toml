[package]
name = "palet-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Mobile application for Palet Vendéen - Dioxus implementation for iOS and Android"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Dioxus for mobile
dioxus = { version = "0.5", features = ["mobile", "router"] }
dioxus-router = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared types
palet-shared = { path = "../rust-shared" }

# Utilities
log = "0.4"

[features]
default = []
mobile = []

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"
