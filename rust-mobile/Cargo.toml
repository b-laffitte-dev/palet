[package]
name = "palet-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Mobile application for Palet Vendéen - Tauri implementation for iOS and Android"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Tauri for mobile
tauri = { version = "2.0", features = ["mobile"] }

# Shared types
palet-shared = { path = "../rust-shared" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
log = "0.4"
