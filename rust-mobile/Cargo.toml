[package]
name = "palet-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Mobile application for Palet Vendéen - Dioxus implementation for iOS and Android"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Dioxus for mobile
dioxus = { version = "0.7.10", features = ["mobile", "router"] }
dioxus-router = "0.7.10"
dioxus-desktop = "0.7.10"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Time with SQLx support
chrono = { version = "0.4.45", features = ["serde"] }

# UUID
uuid = { version = "1.28.0", features = ["v4", "serde"] }

# Shared types
palet-shared = { path = "../rust-shared" }

# Utilities
log = "0.4.34"

[features]
default = []
mobile = []

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2.7"
