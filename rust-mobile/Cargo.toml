[package]
name = "palet-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Mobile application for Palet Vendéen - Tauri implementation for iOS and Android"

[lib]
crate-type = ["cdylib", "rlib"]
name = "palet_mobile"

[dependencies]
# Disable tauri mobile for now - needs special platform setup
tauri = { version = "2", features = ["macos-private-api"], optional = true }

# Shared types
palet-shared = { path = "../rust-shared" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
log = "0.4"
