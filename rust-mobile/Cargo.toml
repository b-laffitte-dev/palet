[package]
name = "palet-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Palet Vendéen Team"]
description = "Mobile application for Palet Vendéen - Dioxus implementation for iOS and Android"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Dioxus for mobile
dioxus = { version = "0.7.10", features = ["mobile", "router"] }
dioxus-router = "0.7.10"
dioxus-desktop = "0.7.10"

# Time ("wasm-bindgen" : now_utc() fonctionne sur wasm32-unknown-unknown)
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing", "wasm-bindgen"] }

# Utilities
log = "0.4.34"

[features]
default = []
mobile = []
